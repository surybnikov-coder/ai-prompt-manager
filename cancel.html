<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отмена подписки — AI Prompt Manager</title>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("fonts/SpaceGrotesk-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("fonts/SpaceGrotesk-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("fonts/SpaceGrotesk-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #000000;
      --card: #181818;
      --text: #ffffff;
      --muted: #b3b3b3;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --border: rgba(255,255,255,0.08);
      --error: #ff4d4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 60px 20px 40px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    h1 {
      font-size: 1.5rem;
      margin: 24px 0 12px;
      text-align: center;
    }
    p {
      color: var(--muted);
      text-align: center;
      margin: 0 0 28px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      background: #121212;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.9rem;
      display: none;
    }
    .message.success {
      display: block;
      background: rgba(29, 185, 84, 0.15);
      border: 1px solid rgba(29, 185, 84, 0.3);
      color: #fff;
    }
    .message.error {
      display: block;
      background: rgba(255, 77, 77, 0.12);
      border: 1px solid rgba(255, 77, 77, 0.3);
      color: #fff;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">AI <span>Prompt</span> Manager</div>
    </header>

    <h1>Отмена автопродления</h1>
    <p>После отмены текущий оплаченный период Pro Monthly останется активным до конца срока.</p>

    <div class="card">
      <label for="email">Email, указанный при покупке</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

      <label for="key">Лицензионный ключ</label>
      <input type="text" id="key" placeholder="email|yyyy-mm-dd|hash" autocomplete="off">

      <button id="cancel-btn" type="button">Отменить автопродление</button>
      <div id="message" class="message"></div>
    </div>

    <footer>
      <p>Вернуться на <a href="index.html">главную</a> | <a href="privacy.html">Privacy Policy</a></p>
      <p>© 2026 AI Prompt Manager</p>
    </footer>
  </div>

  <script>
    const API_BASE = "https://aixport.ru";

    function showMessage(text, isError) {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = "message " + (isError ? "error" : "success");
    }

    document.getElementById("cancel-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const key = document.getElementById("key").value.trim();
      const btn = document.getElementById("cancel-btn");

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage("Введите корректный email", true);
        return;
      }
      if (!key) {
        showMessage("Введите лицензионный ключ", true);
        return;
      }

      btn.disabled = true;
      showMessage("Отправка запроса...", false);

      try {
        const res = await fetch(`${API_BASE}/cancel-subscription`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, key }),
        });
        const data = await res.json();
        if (data.ok) {
          showMessage("Автопродление успешно отменено. Текущий период остаётся активным.", false);
        } else {
          showMessage(data.error || "Не удалось отменить подписку. Проверьте email и ключ.", true);
        }
      } catch (err) {
        showMessage("Ошибка сети. Попробуйте позже.", true);
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
